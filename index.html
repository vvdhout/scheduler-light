<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1012" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Default to light; use dark when the OS prefers dark OR it's night
         (before ~7am / after ~7pm local). Runs before paint to avoid a flash,
         and re-checks when the OS theme changes or the tab is refocused. */
      (function () {
        function apply() {
          try {
            var sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
            var h = new Date().getHours();
            var night = h >= 19 || h < 7;
            document.documentElement.setAttribute('data-theme', (sysDark || night) ? 'dark' : 'light');
          } catch (e) {}
        }
        apply();
        try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply); } catch (e) {}
        document.addEventListener('visibilitychange', function () { if (!document.hidden) apply(); });
      })();
    </script>
